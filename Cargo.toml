[workspace]
resolver = "3"
members = [
    "crates/fujicli",
    "crates/fujicodegen",
    "crates/fujicore",
    "crates/ptp-cursor",
    "crates/ptp-macro",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]

[workspace.dependencies]
anyhow = "1.0.102"
byteorder = "1.5.0"
clap = "4.6.1"
derive_more = "2.1.1"
erased-serde = "0.4.10"
exiftool = "0.3.1"
fujicodegen = { path = "crates/fujicodegen" }
fujicore = { path = "crates/fujicore" }
heck = "0.5.0"
log = "0.4.32"
log4rs = "1.4.0"
num_enum = "0.7.6"
prettyplease = "0.2.37"
proc-macro2 = "1.0.106"
ptp-cursor = { path = "crates/ptp-cursor" }
ptp-macro = { path = "crates/ptp-macro" }
quote = "1.0.45"
rusb = "0.9.4"
serde = "1.0.228"
serde_json = "1.0.150"
serde_with = "3.21.0"
strum = "0.28.0"
strum_macros = "0.28.0"
syn = "2.0.117"
tempfile = "3.27.0"
thiserror = "2.0.18"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }

missing_docs_in_private_items = "allow"
missing_errors_doc            = "allow"
missing_panics_doc            = "allow"
similar_names                 = "allow"
too_many_lines                = "allow"
too_many_arguments            = "allow"
cognitive_complexity          = "allow"

unwrap_used = "deny"

[profile.release]
panic         = 'abort'
strip         = true
lto           = true
codegen-units = 1
