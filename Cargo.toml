[workspace]
members = [
    ".",
    "crates/codegen",
    "crates/ptp/cursor",
    "crates/ptp/macro",
]

[package]
name = "fujicli"
version = "0.2.0"
edition = "2024"
description = "A CLI to manage Fujifilm devices, simulations, backups, and rendering"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]
build = "build.rs"

[lib]
name = "fujicli"
path = "src/lib/mod.rs"

[[bin]]
name = "fujicli"
path = "src/main.rs"

[build-dependencies]
anyhow = "1.0.102"
codegen = { path = "crates/codegen" }

[profile.release]
panic         = 'abort'
strip         = true
lto           = true
codegen-units = 1

[dependencies]
anyhow = "1.0.102"
byteorder = "1.5.0"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
log = "0.4.32"
log4rs = "1.4.0"
num_enum = "0.7.6"
rusb = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strsim = "0.11.1"
ptp_macro = { path = "crates/ptp/macro" }
ptp_cursor = { path = "crates/ptp/cursor" }
strum = "0.28.0"
strum_macros = "0.28.0"
erased-serde = "0.4.10"
serde_with = "3.21.0"
exiftool = "0.3.1"
tempfile = "3.27.0"
