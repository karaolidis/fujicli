name: Camera report
description: Report which features work on a camera.
body:
  - type: markdown
    attributes:
      value: |
        Take a backup with `fujicli backup export` before testing anything that
        writes to the camera. Replace serial numbers if you like.
  - type: input
    id: version
    attributes:
      label: fujicli --version
      description: If you built from source, add the commit.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Linux, macOS, Windows 11
    validations:
      required: true
  - type: textarea
    id: device-list
    attributes:
      label: fujicli device list
      render: text
    validations:
      required: true
  - type: textarea
    id: device-info
    attributes:
      label: fujicli -vvv device info
      render: text
    validations:
      required: true
  - type: textarea
    id: reverse-info
    attributes:
      label: fujicli -vvv -d <serial> device reverse info
      render: text
  - type: textarea
    id: results
    attributes:
      label: What you tested
      description: Each command you ran, what happened, and its output with `-vvv`.
    validations:
      required: true
