[package]
name = "fujicli"
version = "0.2.0"
edition = "2024"
description = "A CLI to manage Fujifilm devices, simulations, backups, and rendering"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]

[lints]
workspace = true

[[bin]]
name = "fujicli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
fujicore = { path = "../fujicore" }
log = "0.4.32"
log4rs = "1.4.0"
ptp-cursor = { path = "../ptp-cursor" }
rusb = "0.9.4"
serde_json = "1.0.150"
strum = { version = "0.28.0", features = ["strum_macros"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
