[package]
name = "fujicore"
version = "0.2.0"
edition = "2024"
description = "Core library for managing Fujifilm devices, simulations, backups, and rendering"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]
build = "build.rs"

[build-dependencies]
anyhow = "1.0.102"
fujicodegen = { path = "../fujicodegen" }

[dependencies]
anyhow = "1.0.102"
byteorder = "1.5.0"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
erased-serde = "0.4.10"
exiftool = "0.3.1"
log = "0.4.32"
num_enum = "0.7.6"
ptp-cursor = { path = "../ptp-cursor" }
ptp-macro = { path = "../ptp-macro" }
rusb = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.21.0"
strsim = "0.11.1"
strum = "0.28.0"
strum_macros = "0.28.0"
